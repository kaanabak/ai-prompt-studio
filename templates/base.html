<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PromptForge</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><nav><strong>PromptForge</strong><a href="/">Home</a><a href="/generator">Create</a><a href="/prompts">Library</a></nav><main>{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flashes">{% for category, message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
