# PromptForge is intentionally distributed as a runnable script (see run.sh /
# run.bat), not an installable package, so this file only configures dev
# tooling — no [project]/[build-system] here.

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
